    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8aa6"/>
      <stop offset="1" stop-color="#284b3a"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <g fill="#faf8f4">
    <path d="M5,27 C13,23.9 21,15.5 27.5,6 L27.5,11.5 C21,18.5 13,24.7 5,27 Z" opacity="0.95"/>
    <path d="M5,27 C13,25.1 21,19.9 27.5,14 L27.5,19 C21,22.6 13,25.8 5,27 Z" opacity="0.8"/>
    <path d="M5,27 C13,26.2 21,24 27.5,21.5 L27.5,26 C21,26.5 13,26.9 5,27 Z" opacity="0.62"/>
  </g>
</svg>
